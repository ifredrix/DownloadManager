<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ifredrix Download Manager</title>
<style>
body { font: 13px -apple-system, "Segoe UI", sans-serif; padding: 12px 14px; width: 220px; margin: 0; color: #1c222c; background: #fff; }
h3 { margin: 0 0 6px 0; font-size: 14px; }
p { margin: 0; line-height: 1.45; }
.ok { color: #2a7a3b; }
.bad { color: #a03030; }
code { background: #f3f4f7; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h3>ifredrix Download Manager</h3>
<p id="status">Checking…</p>
<script>
const PORTS = [8795, 8796, 8797, 8798];
const SRC = "opera-popup";
const el = document.getElementById("status");
(async () => {
    for (const port of PORTS) {
        try {
            const r = await fetch("http://127.0.0.1:" + port + "/heartbeat?source=" + SRC, { cache: "no-store" });
            if (r.ok) {
                el.className = "ok";
                el.innerHTML = "Connected.<br>Right-click any link and choose <b>Send to ifredrix</b>, or click the download panel over videos.";
                return;
            }
        } catch (_) { /* port closed, try next */ }
    }
    el.className = "bad";
    el.innerHTML = "App is not running. Start <code>ifredrixDownloadManager</code> to enable capture.";
})();
</script>
</body>
</html>
